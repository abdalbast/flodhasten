<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flodhästen - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #002f6c 0%, #3498db 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            text-align: center;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hippo-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .offline-message {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #f39c12;
        }

        .offline-message h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #f39c12;
        }

        .offline-message p {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #27ae60;
            color: white;
        }

        .btn-primary:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .connection-status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(231, 76, 60, 0.2);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <span class="hippo-icon">🦛</span>
        
        <h1>Flodhästen</h1>
        <p class="subtitle">Learn Swedish with the River Horse</p>
        
        <div class="offline-message">
            <h2>You're Offline</h2>
            <p>Don't worry! You can still review your learned words and practice offline. New lessons will be available when you're back online.</p>
        </div>
        
        <div class="action-buttons">
            <a href="/review" class="btn btn-primary">
                📚 Review Learned Words
            </a>
            <button onclick="window.location.reload()" class="btn btn-secondary">
                🔄 Try Again
            </button>
        </div>
        
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>No Internet Connection</span>
        </div>
        
        <div class="connection-status">
            <strong>Offline Mode:</strong> Limited functionality available
        </div>
    </div>

    <script>
        // Check for network connectivity
        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }

        // Listen for online/offline events
        window.addEventListener('online', () => {
            window.location.href = '/';
        });

        // Check connection every 5 seconds
        setInterval(checkConnection, 5000);

        // Add some interactivity
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (btn.textContent.includes('Try Again')) {
                        e.preventDefault();
                        window.location.reload();
                    }
                });
            });
        });
    </script>
</body>
</html>
